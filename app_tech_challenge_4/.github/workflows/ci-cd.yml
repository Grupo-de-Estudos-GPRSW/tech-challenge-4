name: Qualidade e entrega

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Testes Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml

  container:
    name: Construir, verificar e entregar imagem
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nome de imagem em minúsculas
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build da aplicação leve
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: g95:check
      - name: Smoke test HTTP do container
        shell: bash
        run: |
          docker run -d --name g95-check -p 8501:8501 g95:check
          trap 'docker logs g95-check; docker rm -f g95-check' EXIT
          for attempt in {1..30}; do
            if curl --fail http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Login GHCR somente em tags de release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Entrega contínua no GHCR
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
